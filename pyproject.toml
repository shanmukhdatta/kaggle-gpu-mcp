[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kaggle-gpu-mcp"
version = "0.1.0"
description = "Persistent Kaggle CPU/GPU experiment execution and dataset workflows via MCP"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name="Kaggle GPU MCP Contributors"}]
dependencies = ["mcp>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.12"]

[project.scripts]
kaggle-gpu-mcp = "kaggle_gpu_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.setuptools.package-data]
kaggle_gpu_mcp = ["*.py.txt"]
